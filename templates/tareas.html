{% extends "base.html" %}

{% block content %}
<div class="container mt-4" style="max-width: 800px;">
    <div class="text-center mb-5">
        <h2 class="fw-bold">Gestor de Tareas</h2>
        <p class="text-muted">Organiza tus pendientes del día</p>
    </div>

    <!-- Formulario de Entrada -->
    <div class="card shadow-sm border-0 mb-4 p-3">
        <form action="{{ url_for('agregar_tarea') }}" method="POST" class="row g-2">
            <div class="col-md-7">
                <input type="text" name="tarea" class="form-control" placeholder="¿Qué tarea tienes pendiente?" required>
            </div>
            <div class="col-md-3">
                <input class="form-control" name="categoria" list="datalistOptions" placeholder="Categoría">
                <datalist id="datalistOptions">
                    <option value="Escuela">
                    <option value="Programación">
                    <option value="Hogar">
                    <option value="PAEC">
                </datalist>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Guardar</button>
            </div>
        </form>
    </div>

    <!-- Lista de Tareas -->
    <div class="row row-cols-1 g-3">
        {% for t in tareas %}
        <div class="col">
            <div class="card h-100 shadow-sm border-start border-primary border-4">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="mb-0 fw-bold">{{ t.titulo }}</h6>
                        <span class="badge bg-light text-dark border">{{ t.categoria or 'General' }}</span>
                    </div>
                    <form action="{{ url_for('eliminar_tarea') }}" method="POST">
                        <input type="hidden" name="id" value="{{ t._id }}">
                        <button type="submit" class="btn btn-link text-danger p-0">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </form>
                </div>
            </div>
        </div>
        {% else %}
        <div class="text-center mt-5">
            <img src="{{ url_for('static', filename='img/empty.png') }}" style="width: 150px; opacity: 0.5;">
            <p class="text-muted mt-3">No hay tareas pendientes. ¡Tómate un descanso!</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
