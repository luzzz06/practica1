{% extends "base.html" %}
{% block content %}
 <div class="row">
            <div class="col-12">
                <div class="card bg-warning-subtle border-warning-subtle shadow-sm mb-5">
                    <div class="card-header bg-transparent border-bottom border-danger py-3">
                        <h2 class="h4 mb-0 fw-bold">tareas</h2>
                    </div>
                    <div class="card-body p-4">
                        {% block content %}{% endblock %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <form action="/agregar" method="POST" class="input-group mb-4 shadow-sm">
        <input type="text" name="tarea" class="form-control border-warning" placeholder="Escribe una nueva tarea..." required>
        <button class="btn btn-danger-subtle fw-bold" type="submit">Agregar</button>
    </form>

    <div class="d-flex flex-column gap-3">
        {% if tareas %}
            {% for tarea in tareas %}
                <div class="p-3 border rounded shadow-sm bg-white d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center">
                        <input class="form-check-input mt-0 me-3" type="checkbox" value="" id="check{{ loop.index }}" style="transform: scale(1.3);">
                        <label class="form-check-label fs-5" for="check{{ loop.index }}">
                            {{ tarea.nombre }}
                        </label>
                    </div>
                    
                    <form action="/eliminar-tarea" method="POST" class="m-0">
                        <input type="hidden" name="id" value="{{ loop.index0 }}">
                        <button type="submit" class="btn btn-outline-danger btn-sm border-0">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </form>
                </div>
            {% endfor %}
        {% else %}
            <p class="text-muted text-center">No hay tareas aún.</p>
        {% endif %}
    </div>
{% endblock %}
