<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-warning shadow-sm mb-4">
        <div class="container-fluid">
            <div class="ms-auto">
                <a href="#" class="btn bg-warning-subtle border-warning shadow-sm me-2">Iniciar Sesión</a>
                <a href="#" class="btn bg-warning-subtle border-warning shadow-sm">Regístrate</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row justify-content-center mb-5">
            {% block cards %}{% endblock %}
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card bg-warning-subtle border-warning-subtle shadow-sm mb-5">
                    <div class="card-header bg-transparent border-bottom border-warning py-3">
                        <h2 class="h4 mb-0 fw-bold">tareas</h2>
                    </div>
                    <div class="card-body p-4">
                        {% block content %}{% endblock %}
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
