<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Mis Tareas</span>
    </div>
  </nav>

  <div class="container mt-4">

    <!-- Formulario -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Nueva tarea</h5>
        <input type="text" class="form-control mb-2" placeholder="Escribe una tarea...">
        <button class="btn btn-success">Agregar</button>
      </div>
    </div>

    <!-- Lista de tareas -->
    <div class="row">

      <!-- Tarea -->
      <div class="col-md-4">
        <div class="card border-success mb-3">
          <div class="card-body">
            <h5 class="card-title">Estudiar Bootstrap</h5>
            <p class="card-text">Aprender componentes básicos</p>
            <span class="badge bg-success">Completada</span>
            <div class="mt-2">
              <button class="btn btn-sm btn-warning">Editar</button>
              <button class="btn btn-sm btn-danger">Eliminar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Otra tarea -->
      <div class="col-md-4">
        <div class="card border-warning mb-3">
          <div class="card-body">
            <h5 class="card-title">Hacer ejercicio</h5>
            <p class="card-text">30 minutos diarios</p>
            <span class="badge bg-warning text-dark">Pendiente</span>
            <div class="mt-2">
              <button class="btn btn-sm btn-warning">Editar</button>
              <button class="btn btn-sm btn-danger">Eliminar</button>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
