{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h3 class="fw-bold mb-4 text-center">✨ Mis Objetivos y Metas</h3>
            
            <!-- Meta 1 -->
            <div class="card border-0 shadow-sm mb-4 p-3" style="border-radius: 20px;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="fw-bold m-0"><i class="bi bi-laptop me-2 text-primary"></i> Terminar Proyecto PAEC</h5>
                        <span class="badge bg-primary-subtle text-primary">80%</span>
                    </div>
                    <div class="progress" style="height: 12px; border-radius: 10px;">
                        <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" 
                             role="progressbar" style="width: 80%"></div>
                    </div>
                    <p class="small text-muted mt-2 mb-0">Falta pulir los últimos detalles del CSS.</p>
                </div>
            </div>

            <!-- Meta 2 -->
            <div class="card border-0 shadow-sm mb-4 p-3" style="border-radius: 20px;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="fw-bold m-0"><i class="bi bi-book me-2 text-success"></i> Leer 5 libros al año</h5>
                        <span class="badge bg-success-subtle text-success">40%</span>
                    </div>
                    <div class="progress" style="height: 12px; border-radius: 10px;">
                        <div class="progress-bar bg-success" role="progressbar" style="width: 40%"></div>
                    </div>
                    <p class="small text-muted mt-2 mb-0">Vas en el segundo libro, ¡tú puedes!</p>
                </div>
            </div>

            <!-- Meta 3 -->
            <div class="card border-0 shadow-sm mb-4 p-3" style="border-radius: 20px;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="fw-bold m-0"><i class="bi bi-piggy-bank me-2 text-danger"></i> Ahorrar para Vacaciones</h5>
                         <span class="badge bg-danger-subtle text-danger">25%</span>
                    </div>
                    <div class="progress" style="height: 12px; border-radius: 10px;">
                        <div class="progress-bar bg-danger" role="progressbar" style="width: 25%"></div>
                    </div>
                    <p class="small text-muted mt-2 mb-0">Meta: $2,000 MXN. Llevas $500.</p>
                </div>
            </div>

            <!-- Botón para volver -->
            <div class="text-center mt-4">
                <a href="{{ url_for('index') }}" class="btn btn-light rounded-pill px-4 shadow-sm">
                    <i class="bi bi-house-door me-1"></i> Inicio
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
