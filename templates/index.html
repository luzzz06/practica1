{% extends "base.html" %}

    <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center text-center">
        <div class="col">

                <img src="{{ url_for('static', filename='img/e.jpeg') }}" class="card-img-top rounded-circle mx-auto" alt="Agenda"  style="width: 250px; height: 250px; ">
                <div class="card-body d-flex flex-column">



                    <h5 class="card-title fw-bold">Tareas</h5>

                    <div class="mt-auto">
                   
                   <a href="{{ url_for('tareas') }}" class="btn btn-registro w-100">
    <i class="bi bi-list-check"></i> Ir a Tareas</a>
                        
                    </div>
                </div>

        <div class="col">

                <div class="card-body d-flex flex-column">
