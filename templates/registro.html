{% extends "base.html" %}

{% block title %}Crear Cuenta{% endblock %}

{% block content %}
<div class="registro-container">
    <div class="col-md-5 mx-auto">
        <div class="card card-registro">
            <div class="registro-header">
                <img src="{{ url_for('static', filename='img/m.jpeg') }}" 
                     class="rounded-circle mb-2" 
                     style="width: 70px; height: 70px; object-fit: cover; border: 2px solid white;">
                <h3 class="mb-0">Regístrate</h3>
                <small>Únete a tu agenda personal</small>
            </div>
            
            <div class="card-body p-4">
                <form action="/registro" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold" style="color: #ad1457;">Nombre de Usuario</label>
                        <input type="text" name="usuario" class="form-control form-control-custom" placeholder="@usuario" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold" style="color: #ad1457;">Tu mejor Email</label>
                        <input type="email" name="email" class="form-control form-control-custom" placeholder="ejemplo@correo.com" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold" style="color: #ad1457;">Contraseña</label>
                        <input type="password" name="password" class="form-control form-control-custom" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold" style="color: #ad1457;">Confirmar Contraseña</label>
                        <input type="password" name="confirm_password" class="form-control form-control-custom" required>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-registro">
                            ¡Comenzar ahora!
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <p class="small text-muted">¿Ya tienes cuenta? <a href="/login" style="color: #f06292; font-weight: bold; text-decoration: none;">Inicia sesión</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
